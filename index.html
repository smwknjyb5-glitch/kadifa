  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكاة حركة القذيفة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a0e27;
    --navy2:#131a3a;
    --gold:#d4af37;
    --gold2:#f4e5b2;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--navy);
    color:#eee;
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #stars{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:1000px;
    margin:0 auto;
    padding:20px;
  }
  h1{
    text-align:center;
    color:var(--gold);
    font-weight:800;
    font-size:2em;
    margin-bottom:5px;
    text-shadow:0 0 15px rgba(212,175,55,0.4);
  }
  .subtitle{
    text-align:center;
    color:#9aa5c9;
    margin-bottom:25px;
    font-size:0.95em;
  }
  .panel{
    background:linear-gradient(145deg,var(--navy2),#0d1230);
    border:1px solid rgba(212,175,55,0.3);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-bottom:15px;
  }
  .field label{
    display:block;
    color:var(--gold2);
    font-size:0.85em;
    margin-bottom:6px;
  }
  .field input[type=range]{
    width:100%;
    accent-color:var(--gold);
  }
  .field .val{
    color:var(--gold);
    font-weight:800;
    float:left;
  }
  button{
    background:linear-gradient(145deg,var(--gold),#b8901f);
    color:var(--navy);
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:1em;
    cursor:pointer;
    transition:transform 0.2s, box-shadow 0.2s;
  }
  button:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(212,175,55,0.4);
  }
  button:active{transform:translateY(0);}
  .btn-row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
  }
  canvas#sim{
    width:100%;
    display:block;
    background:radial-gradient(ellipse at bottom, #0d1a3d 0%, #060915 100%);
    border-radius:12px;
    border:1px solid rgba(212,175,55,0.3);
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
    margin-top:15px;
  }
  .stat{
    background:rgba(212,175,55,0.08);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:10px;
    padding:12px;
    text-align:center;
  }
  .stat .num{
    color:var(--gold);
    font-weight:800;
    font-size:1.3em;
    display:block;
  }
  .stat .lbl{
    color:#9aa5c9;
    font-size:0.8em;
  }
  footer{
    text-align:center;
    color:#5a6491;
    font-size:0.8em;
    margin-top:20px;
    padding-bottom:20px;
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <h1>🚀 محاكاة حركة القذيفة</h1>
  <p class="subtitle">أدخل السرعة الابتدائية وزاوية الإطلاق وشاهد المسار الفيزيائي للقذيفة</p>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label>السرعة الابتدائية <span class="val" id="vVal">30</span> م/ث</label>
        <input type="range" id="vSlider" min="5" max="100" value="30">
      </div>
      <div class="field">
        <label>زاوية الإطلاق <span class="val" id="aVal">45</span>°</label>
        <input type="range" id="aSlider" min="1" max="89" value="45">
      </div>
      <div class="field">
        <label>الجاذبية <span class="val" id="gVal">9.8</span> م/ث²</label>
        <input type="range" id="gSlider" min="1" max="25" value="9.8" step="0.1">
      </div>
      <div class="field">
        <label>ارتفاع الإطلاق <span class="val" id="hVal">0</span> م</label>
        <input type="range" id="hSlider" min="0" max="50" value="0">
      </div>
    </div>
    <div class="btn-row">
      <button id="launchBtn">🔥 إطلاق</button>
      <button class="btn-secondary" id="resetBtn">↺ إعادة تعيين</button>
    </div>
  </div>

  <div class="panel">
    <canvas id="sim" width="960" height="480"></canvas>
    <div class="stats">
      <div class="stat"><span class="num" id="rangeStat">0</span><span class="lbl">المدى الأفقي (م)</span></div>
      <div class="stat"><span class="num" id="heightStat">0</span><span class="lbl">أقصى ارتفاع (م)</span></div>
      <div class="stat"><span class="num" id="timeStat">0</span><span class="lbl">زمن الطيران (ث)</span></div>
      <div class="stat"><span class="num" id="speedStat">0</span><span class="lbl">السرعة الحالية (م/ث)</span></div>
    </div>
  </div>

  <footer>محاكاة فيزيائية تفاعلية — حركة المقذوفات</footer>
</div>

<script>
// ===== خلفية النجوم المتحركة =====
const starsCanvas = document.getElementById('stars');
const sctx = starsCanvas.getContext('2d');
function resizeStars(){
  starsCanvas.width = window.innerWidth;
  starsCanvas.height = window.innerHeight;
}
resizeStars();
window.addEventListener('resize', resizeStars);

let stars = [];
for(let i=0;i<160;i++){
  stars.push({
    x: Math.random()*starsCanvas.width,
    y: Math.random()*starsCanvas.height,
    r: Math.random()*1.5+0.3,
    a: Math.random(),
    speed: Math.random()*0.02+0.005
  });
}
function drawStars(){
  sctx.clearRect(0,0,starsCanvas.width,starsCanvas.height);
  sctx.fillStyle = '#0a0e27';
  sctx.fillRect(0,0,starsCanvas.width,starsCanvas.height);
  for(const s of stars){
    s.a += s.speed;
    const alpha = Math.abs(Math.sin(s.a));
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    sctx.fillStyle = `rgba(212,175,55,${alpha*0.8})`;
    sctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// ===== محاكاة القذيفة =====
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');

const vSlider = document.getElementById('vSlider');
const aSlider = document.getElementById('aSlider');
const gSlider = document.getElementById('gSlider');
const hSlider = document.getElementById('hSlider');
const vVal = document.getElementById('vVal');
const aVal = document.getElementById('aVal');
const gVal = document.getElementById('gVal');
const hVal = document.getElementById('hVal');

const rangeStat = document.getElementById('rangeStat');
const heightStat = document.getElementById('heightStat');
const timeStat = document.getElementById('timeStat');
const speedStat = document.getElementById('speedStat');

let animId = null;
let trail = [];
let simTime = 0;
let running = false;

function updateLabels(){
  vVal.textContent = vSlider.value;
  aVal.textContent = aSlider.value;
  gVal.textContent = gSlider.value;
  hVal.textContent = hSlider.value;
}
[vSlider,aSlider,gSlider,hSlider].forEach(s=>s.addEventListener('input', ()=>{
  updateLabels();
  if(!running) drawStatic();
}));
updateLabels();

function getParams(){
  return {
    v0: parseFloat(vSlider.value),
    angleDeg: parseFloat(aSlider.value),
    g: parseFloat(gSlider.value),
    h0: parseFloat(hSlider.value)
  };
}

function computeTrajectory(){
  const {v0, angleDeg, g, h0} = getParams();
  const angle = angleDeg * Math.PI/180;
  const vx = v0*Math.cos(angle);
  const vy0 = v0*Math.sin(angle);

  // زمن الطيران الكلي (حل معادلة تربيعية: h0 + vy0*t - 0.5*g*t^2 = 0)
  const disc = vy0*vy0 + 2*g*h0;
  const tFlight = (vy0 + Math.sqrt(disc)) / g;
  const range = vx * tFlight;
  const tPeak = vy0/g;
  const maxHeight = h0 + (tPeak>0 ? vy0*tPeak - 0.5*g*tPeak*tPeak : 0);

  return {vx, vy0, g, h0, tFlight, range, maxHeight};
}

function worldToCanvas(x, y, scale, groundY){
  return {
    cx: 40 + x*scale,
    cy: groundY - y*scale
  };
}

function drawScene(t, params){
  const {vx, vy0, g, h0, tFlight, range, maxHeight} = params;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const groundY = canvas.height - 40;
  const maxX = Math.max(range, 10);
  const maxY = Math.max(maxHeight, 10);
  const scaleX = (canvas.width-80) / maxX;
  const scaleY = (canvas.height-80) / maxY;
  const scale = Math.min(scaleX, scaleY);

  // الأرض
  ctx.strokeStyle = 'rgba(212,175,55,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(canvas.width, groundY);
  ctx.stroke();

  // شبكة خفيفة
  ctx.strokeStyle = 'rgba(154,165,201,0.1)';
  ctx.lineWidth = 1;
  for(let gx=0; gx<canvas.width; gx+=50){
    ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,groundY); ctx.stroke();
  }

  // مسار الحركة (المنحنى الكامل كخط خفيف)
  ctx.strokeStyle = 'rgba(212,175,55,0.25)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const tt = tFlight*i/100;
    const x = vx*tt;
    const y = h0 + vy0*tt - 0.5*g*tt*tt;
    const p = worldToCanvas(x,y,scale,groundY);
    if(i===0) ctx.moveTo(p.cx,p.cy); else ctx.lineTo(p.cx,p.cy);
  }
  ctx.stroke();

  // الأثر المرسوم حتى الآن
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#d4af37';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  trail.forEach((pt,i)=>{
    if(i===0) ctx.moveTo(pt.cx,pt.cy); else ctx.lineTo(pt.cx,pt.cy);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;

  // القذيفة الحالية
  const clampedT = Math.min(t, tFlight);
  const x = vx*clampedT;
  const y = Math.max(h0 + vy0*clampedT - 0.5*g*clampedT*clampedT, 0);
  const pos = worldToCanvas(x,y,scale,groundY);

  trail.push(pos);

  ctx.beginPath();
  ctx.arc(pos.cx, pos.cy, 8, 0, Math.PI*2);
  ctx.fillStyle = '#f4e5b2';
  ctx.shadowColor = '#f4e5b2';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;

  // نقطة الانطلاق
  const startPos = worldToCanvas(0,h0,scale,groundY);
  ctx.beginPath();
  ctx.arc(startPos.cx, startPos.cy, 5, 0, Math.PI*2);
  ctx.fillStyle = '#6a7ab8';
  ctx.fill();

  // السرعة الحالية
  const vyCurrent = vy0 - g*clampedT;
  const speedNow = Math.sqrt(vx*vx + vyCurrent*vyCurrent);

  rangeStat.textContent = range.toFixed(1);
  heightStat.textContent = maxHeight.toFixed(1);
  timeStat.textContent = clampedT.toFixed(2);
  speedStat.textContent = speedNow.toFixed(1);
}

function drawStatic(){
  trail = [];
  const params = computeTrajectory();
  drawScene(0, params);
}

function animate(){
  const params = computeTrajectory();
  const dt = 0.016;
  simTime += dt;

  drawScene(simTime, params);

  if(simTime < params.tFlight){
    animId = requestAnimationFrame(animate);
  } else {
    running = false;
  }
}

document.getElementById('launchBtn').addEventListener('click', ()=>{
  if(animId) cancelAnimationFrame(animId);
  trail = [];
  simTime = 0;
  running = true;
  animate();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(animId) cancelAnimationFrame(animId);
  running = false;
  simTime = 0;
  trail = [];
  drawStatic();
});

drawStatic();
</script>
</body>
</html>
